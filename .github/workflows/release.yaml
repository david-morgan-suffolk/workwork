name: Build and Publish
on:
  push:
    branches:
      - 'releases/**'

permissions:
  contents: write

jobs:
  build-job:
    name: Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup UV
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          activate-environment: true
          python-version: 3.12
          cache-dependency-glob: "uv.lock"

      - name: Installing Python
        run: uv pip install --python=3.12 pip

      - name: Clear cache
        run: uv cache clean

      - name: Run Tests
        id: testing
        run: |
          uv run pytest
          echo "::testing name=pytest_result::true"

      - name: Build Project
        if: steps.testing.outcome == 'success'
        run: uv build

      - name: Bump Version
        id: tagging
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: workwork
          # Only bump with angular conventions
          default_bump: false

      - name: Release Version
        if: steps.tagging.outputs.new_tag != 'undefined'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tagging.outputs.new_tag }}
          name: Release ${{ steps.tagging.outputs.new_tag }}
          body: ${{ steps.tagging.outputs.changelog }}

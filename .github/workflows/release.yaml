
name: Build and Publish

on:
  push:
    branches:
      - main
    
jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Enable caching
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Run Tests
        run: uv run pytest tests

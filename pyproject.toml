[project]
name = "workwork"
version = "0.1.0"
description = "A test for packaging uv projects into tags for releases, along with CI/CD for testing and pre-commits."
readme = "README.md"
authors = [
    { name = "David Morgan", email = "dmorgan@suffolk.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.3.5",
]

[project.scripts]
workwork = "workwork:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "ruff>=0.11.8",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true


[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

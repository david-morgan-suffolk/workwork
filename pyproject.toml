[project]
name = "workwork"
version = "0.1.0"
description = "A test for packaging uv projects into tags for releases, along with CI/CD for testing and pre-commits."
readme = "README.md"
authors = [
    { name = "David Morgan", email = "dmorgan@suffolk.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
workwork = "workwork:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.11.8",
]
